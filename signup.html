<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Paws N' Claws</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Shared Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="logo">🐾 Paws N' Claws</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="login.html" class="cta-btn">Login / Signup</a></li>
        </ul>
    </nav>

    <!-- Main Content Wrapper -->
    <main class="main-content">
        <h1>Create Your Account</h1>
        <p style="margin-bottom: 25px;">Join the Paws N' Claws pack today to manage your pet care schedule.</p>
        
        <div style="background: #f8f9fa; padding: 30px; border-radius: 12px; max-width: 400px; margin: 0 auto; border: 1px solid #e2e8f0;">
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px;">Full Name:</label>
                <input type="text" placeholder="Enter your full name..." style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px;">
            </div>

            <div style="margin-bottom: 15px; text-align: left;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px;">Email Address:</label>
                <input type="email" placeholder="Enter your email address..." style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px;">
            </div>

            <div style="margin-bottom: 20px; text-align: left;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px;">Create Password:</label>
                <input type="password" placeholder="Create a strong password..." style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px;">
            </div>

            <button id="signup-submit-btn" style="width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px;">Register Account</button>
            
            <!-- Link directly back to your standard login page file -->
            <p style="margin-top: 20px; font-size: 14px; color: #555;">Already have an account? <a href="login.html" style="color: #e67e22; font-weight: bold; text-decoration: none;">Log in instead</a></p>
        </div>
    </main>
<!-- Make sure this line is at the bottom of signup.html -->
    <script src="script.js"></script>
</body>
</html>
